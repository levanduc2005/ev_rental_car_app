sonar.projectKey=levanduc2005_ev_rental_car_app
sonar.organization=levanduc2005


# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=ev_rental_car_app
sonar.projectVersion=1.0


# Nguồn quét mã
sonar.sources=lib
sonar.tests=test
# QUAN TRỌNG: Loại trừ các file sinh mã tự động (để không bị tính code smell vô lý)
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,lib/l10n/gen/**,build/**,android/**
# Nạp file báo cáo Coverage từ bài test của bạn
sonar.dart.lcov.reportPaths=coverage/lcov.info
# Loại trừ giao diện UI, router, bootstrap và theme khỏi tính toán độ phủ (tập trung test domain & data)
sonar.coverage.exclusions=lib/main.dart,lib/bootstrap.dart,lib/app/**,lib/features/**/presentation/**,lib/core/widgets/**,lib/core/theme/**
# Bỏ qua kiểm tra trùng lặp (CPD) cho module vehicles và các widget giao diện lặp lại
sonar.cpd.exclusions=lib/features/vehicles/**,lib/features/**/presentation/**
# Bỏ qua cảnh báo xác minh chữ ký JWT trên client di động (JwtDecoder chỉ đọc payload client-side)
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=*S5659*
sonar.issue.ignore.multicriteria.e1.resourceKey=lib/core/utils/jwt_decoder.dart
# Bảng mã
sonar.sourceEncoding=UTF-8
